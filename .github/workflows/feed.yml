name: radar-feed
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-feed
  cancel-in-progress: true
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-feed.txt
      - run: python quant/feed_job.py
      - name: commit feed if changed
        run: |
          git config user.name "yxtSys"
          git config user.email "yxtSys@users.noreply.github.com"
          git add docs/data/feed.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "feed update $(date -u +%H:%M)"
          git push
