name: review-daily
on:
  schedule:
    - cron: "5 7 * * 1-5"   # 北京时间周一至周五 15:05
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-daily
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-feed.txt
      - name: run review + email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python quant/review_job.py
      - name: commit review for pages
        run: |
          if [ -f docs/data/review_latest.md ]; then
            git config user.name "yxtSys"
            git config user.email "yxtSys@users.noreply.github.com"
            git add docs/data/review_latest.md
            git diff --cached --quiet || (git commit -m "review daily" && git push)
          else
            echo "休市无复盘，跳过提交"
          fi
