name: morning-pre-brief
on:
  schedule:
    - cron: "12 1 * * 1-5"   # 北京时间 9:12 竞价前
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morning-pre
  cancel-in-progress: true
jobs:
  pre:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-feed.txt
      - name: run pre-auction brief + email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python quant/pre_job.py
      - name: commit pre brief for pages
        run: |
          if [ -f docs/data/pre_latest.md ]; then
            git config user.name "yxtSys"
            git config user.email "yxtSys@users.noreply.github.com"
            git add docs/data/pre_latest.md
            git diff --cached --quiet || (git commit -m "pre brief" && git push)
          else
            echo "休市无简报，跳过提交"
          fi
